name: Build World of Curses (all-in-one)

# This single file contains the whole mod (NeoForge 1.21.1, Java 21).
# Put it at .github/workflows/build.yml in an otherwise empty GitHub repo; nothing else is needed.
# OPTIONAL: upload your 64x64 skin to the repo root as herobrine.png and it is baked into the jar.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack the mod project
        run: |
          mkdir -p mod
          base64 -d > mod/project.tar.gz <<'WORLD_OF_CURSES_EOF'
