      - name: Add your Herobrine skin (only if herobrine.png is in the repo root)
        run: |
          if [ -f herobrine.png ]; then
            cp herobrine.png mod/src/main/resources/assets/worldofcurses/textures/entity/herobrine.png
            echo "Skin added."
          else
            echo "No herobrine.png found, the mod will use the default skin."
          fi

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build the mod
        working-directory: mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: worldofcurses-jar
          path: mod/build/libs/*.jar
          if-no-files-found: error
